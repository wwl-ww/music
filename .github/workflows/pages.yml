name: Deploy music to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - name: Check site artifact
        run: |
          test -f dist/index.html
          test -z "$(find dist -iname '*.pdf' -print -quit)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id') &&
                [ -n "$artifact" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub did not index the Pages artifact within 60 seconds."
          exit 1
      - uses: actions/deploy-pages@v4
        id: publish
