<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>音阶速查｜和弦音阶速查宝典</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../shared/style.css">
    <link rel="stylesheet" href="../../shared/themes.css">
    <link rel="stylesheet" href="../../shared/formats/formats.css">
    <link rel="stylesheet" href="./reference.css">
    <script src="../../shared/themes.js"></script>
    <script type="module" src="./reference.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="page-width">
        <a class="library-home" href="./index.html">和弦音阶速查宝典</a>
        <button class="settings-button" type="button" popovertarget="settings">设置</button>
        <div id="settings" popover>
          <fieldset id="theme-choices">
            <legend>主题配色</legend>
            <label data-theme="paper"><input type="radio" name="theme" value="paper" checked><span>纸白</span></label>
            <label data-theme="ivory"><input type="radio" name="theme" value="ivory"><span>米浆</span></label>
            <label data-theme="mist"><input type="radio" name="theme" value="mist"><span>雾蓝</span></label>
            <label data-theme="lilac"><input type="radio" name="theme" value="lilac"><span>淡紫</span></label>
            <label data-theme="rose"><input type="radio" name="theme" value="rose"><span>烟粉</span></label>
            <label data-theme="mint"><input type="radio" name="theme" value="mint"><span>薄荷</span></label>
            <label data-theme="amber"><input type="radio" name="theme" value="amber"><span>琥珀</span></label>
            <label data-theme="slate"><input type="radio" name="theme" value="slate"><span>石墨</span></label>
            <label data-theme="midnight"><input type="radio" name="theme" value="midnight"><span>午夜蓝</span></label>
          </fieldset>
        </div>
      </div>
    </header>
    <main class="page-width reference-page" data-reference="scales">
      <nav class="reference-nav" aria-label="本书目录">
        <a href="./foundations.html">基础知识</a>
        <a href="./chords.html">和弦速查</a>
        <a href="./scales.html" aria-current="page">音阶速查</a>
      </nav>
      <h1>音阶速查</h1>
      <p class="intro">按主音和类别查阅大小调、中国五声与七声调式、日本五声、爵士与对称音阶。谱例可切换上下行。</p>
      <noscript><p class="reference-notice">速查需要 JavaScript。<a href="./foundations.html">基础知识</a>可直接阅读。</p></noscript>
      <form class="reference-filters">
        <label for="reference-root">主音</label>
        <select id="reference-root" name="root"></select>
        <label for="reference-family">类别</label>
        <select id="reference-family" name="family"><option value="">全部</option></select>
        <label for="reference-query">搜索音阶</label>
        <input id="reference-query" name="query" type="search" autocomplete="off" spellcheck="false" placeholder="如 D 大调、商调式、都节">
      </form>
      <div class="reference-workspace">
        <section class="reference-results" aria-labelledby="reference-list-title">
          <div class="reference-results-heading">
            <h2 id="reference-list-title">音阶类型</h2>
            <p data-reference-status role="status" hidden>没有匹配的条目。可以缩短关键字或选「全部」。</p>
          </div>
          <ul class="reference-list" data-reference-list></ul>
        </section>
        <section class="reference-detail" data-reference-result aria-labelledby="reference-title">
          <div class="reference-detail-header">
            <div>
              <p class="reference-category" data-reference-category></p>
              <h2 id="reference-title" data-reference-title></h2>
            </div>
            <div class="reference-detail-actions">
              <label for="reference-direction">走向</label>
              <select id="reference-direction" name="direction"><option value="up">上行</option><option value="down">下行</option></select>
              <div data-reference-playback></div>
            </div>
          </div>
          <dl class="reference-degrees" aria-label="音级与音名" data-reference-notes></dl>
          <figure class="reference-staff" data-reference-score></figure>
          <figure class="reference-keyboard keyboard-example">
            <figcaption>钢琴键位</figcaption>
            <div data-reference-keyboard></div>
          </figure>
          <p class="reference-note" data-reference-note hidden></p>
        </section>
      </div>
    </main>
  </body>
</html>
