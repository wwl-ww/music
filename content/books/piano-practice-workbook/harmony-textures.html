      <h1>和声织体综合练习</h1>
      <p class="intro">同一小节的上、下声部用双行简谱对齐。有和弦代号的条目把和弦与落在同一拍的旋律、低音写在一起。谱首为 C 调、四四拍，四分音符每分钟 120。</p>
