      <h1>节奏型与音型训练</h1>
      <p class="intro">双行简谱把上下声部排在同一拍点上，可以对照和弦与低音何时同时起音、何时错开。这组谱以 C 为 1，采用四四拍，谱首速度为每分钟 120 拍。</p>
