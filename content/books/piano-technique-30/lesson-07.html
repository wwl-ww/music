      <p class="practice-meta">
        <span>原谱难度 <span aria-label="1 星，共 3 星" role="img">★☆☆</span></span>
        <span>原谱速度 每分钟 108 个四分音符</span>
      </p>
      <p class="practice-notes">两个指头一起落键，三度的两个音才会同时发声。连续三度可以靠换指让其中一条声部尽量连贯，另一条声部允许极短的衔接空隙。这里左手带断奏，踏板持续过久会抹掉这种对比。</p>
