      <p class="practice-meta">
        <span>原谱难度 <span aria-label="2 星，共 3 星" role="img">★★☆</span></span>
        <span>原谱速度 每分钟 72 个四分音符</span>
      </p>
      <p class="practice-notes">同一拍里，右手平均分成三个音，左手平均分成两个音。把一拍想成六等分，两手从第 1 格同起，右手还在第 3、5 格起音，左手还在第 4 格起音。</p>
