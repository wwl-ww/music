      <p class="practice-meta">
        <span>原谱难度 <span aria-label="2 星，共 3 星" role="img">★★☆</span></span>
        <span>原谱速度 每分钟 69 个四分音符</span>
      </p>
      <p class="practice-notes">手在音区之间整体移动，落点以周围一组黑白键定位。谱例前段右手频繁换音区，后段则由左手承担低音区跨度。预备移动和落键都应占在原有拍速内。需要保留跳前的长音时，可以按谱使用踏板。</p>
